<header class="page-heading"><div><h1>Review policy</h1><p>Configure publication thresholds and execution limits.</p></div></header>
<form class="panel settings-form" [formGroup]="policy" (ngSubmit)="save()">
  <label>Minimum published severity<select formControlName="minimumSeverity"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option></select></label>
  <label>Maximum inline comments<input type="number" min="1" max="50" formControlName="maximumComments"></label>
  <label>Maximum cost per review (USD)<input type="number" min="0.1" step="0.1" formControlName="maximumCost"></label>
  <label class="check"><input type="checkbox" formControlName="verifiedOnly"> Publish only deterministically verified findings</label>
  <label class="check"><input type="checkbox" formControlName="reproductionTests"> Allow sandboxed reproduction tests</label>
  <div class="form-actions"><button class="primary-action" type="submit">Save policy</button>@if (saved()) { <span role="status">Policy saved</span> }@if (error()) { <span class="save-error" role="alert">{{ error() }}</span> }</div>
</form>
