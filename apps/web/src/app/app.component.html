<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Code Review dashboard">
      <span class="brand-mark">C</span><span>Code Review</span>
    </a>
    <div class="organization"><span>Organization</span><strong>Local workspace</strong></div>
    <nav aria-label="Primary navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">▦ Dashboard</a>
      <a routerLink="/reviews" routerLinkActive="active">⑂ Reviews</a>
      <a routerLink="/settings" routerLinkActive="active">⚙ Settings</a>
      <!-- Streamlit is served by the production gateway, outside Angular's router. -->
      <a class="external-link" href="/ops/" target="_blank" rel="noopener">
        ◈ Operations <span aria-hidden="true">↗</span>
      </a>
    </nav>
    <div class="connection-state"><span></span> API connected locally</div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span>Development environment</span><strong aria-label="Current user">GR</strong></header>
    <main><router-outlet /></main>
  </div>
</div>
