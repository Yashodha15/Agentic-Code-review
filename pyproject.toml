[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-review"
version = "0.1.0"
description = "Repository-aware multi-agent code review platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
agents = [
    "langchain-anthropic>=1.7,<2",
    "langgraph>=1.2,<2",
]
api = [
    "fastapi>=0.128,<1",
    "PyJWT[crypto]>=2.10,<3",
    "uvicorn>=0.40,<1",
]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
